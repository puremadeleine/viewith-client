name: viewith
description: "viewith client"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1
  xml: ^6.5.0
  path_parsing: ^1.0.1
  go_router: ^14.3.0
  dio: ^5.7.0
  retry: ^3.1.2
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  flutter_secure_storage: ^9.2.2
  kakao_flutter_sdk_user: ^1.9.6
  freezed: ^2.5.7
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  image_picker: ^1.1.2
  flutter_html: ^3.0.0-beta.2
  http: ^1.2.2
  intl: ^0.20.2
  carousel_slider: ^5.0.0
  flutter_rating_bar: ^4.0.1
  sign_in_with_apple: ^7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mockito: ^5.4.4
  build_runner: ^2.0.0
  riverpod_generator: ^2.6.1
  riverpod_lint: ^2.6.1
  flutter_gen_runner:
  json_serializable: ^6.9.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/seatmap/
    - assets/images/rabbit_profile.png
    - assets/images/chick_profile.png
    - assets/images/cat_profile.png
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Thin.otf
          weight: 100
        - asset: assets/fonts/Pretendard-ExtraLight.otf
          weight: 200
        - asset: assets/fonts/Pretendard-Light.otf
          weight: 300
        - asset: assets/fonts/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/Pretendard-Medium.otf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.otf
          weight: 700
        - asset: assets/fonts/Pretendard-ExtraBold.otf
          weight: 800
        - asset: assets/fonts/Pretendard-Black.otf
          weight: 900

flutter_gen:
  output: lib/ui/gen/
  line_length: 120

  integrations:
    flutter_svg: true